<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0b0b0c"><link rel="apple-touch-icon" href="icon-192.png"><title>Zihin Haritası Planlayıcı</title>
<style>
:root{--bg:#0b0b0c;--fg:#eee;--mut:#8a8a90;--ac:#ffc107;--ok:#22c55e;--pn:#17171a;--bd:#2c2c31;--ink:#111;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#faf8f2;--fg:#1c1c1e;--mut:#6b6b72;--ac:#e6a700;--pn:#fff;--bd:#e2ddd0}}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button,input{font:inherit;color:inherit}
.top{padding:8px 10px 6px;border-bottom:1px solid var(--bd)}
.row{display:flex;align-items:center;gap:6px}
.ib{background:var(--pn);border:1px solid var(--bd);border-radius:10px;min-width:38px;height:38px;cursor:pointer}
input[type=date]{background:var(--pn);border:1px solid var(--bd);border-radius:10px;height:38px;padding:0 8px;flex:1;min-width:0}
.chips{display:flex;gap:6px;margin-top:6px}
.chip{flex:1;background:var(--pn);border:1px solid var(--bd);border-radius:10px;padding:5px 4px;text-align:center;cursor:pointer;line-height:1.25}
.chip b{display:block;font-size:12px}.chip small{color:var(--mut);font-size:11px}
.chip.on{border-color:var(--ac);box-shadow:inset 0 0 0 1px var(--ac)}
.pg{margin-top:6px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut)}
.bar{flex:1;height:7px;background:var(--bd);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
#map{flex:1;position:relative;overflow:hidden;touch-action:none;cursor:grab}
#map svg{position:absolute;inset:0;width:100%;height:100%}
.e{fill:none;stroke:var(--ac);stroke-width:2}.u{stroke:var(--ac);stroke-width:2;fill:none}
.r{fill:var(--ac)}.rt{fill:var(--ink);font-weight:600;font-size:16px}
.t,.t1{fill:var(--fg);font-size:15px;cursor:pointer}.t1{font-weight:600}
.dn{fill:var(--mut);text-decoration:line-through}
.cb{fill:none;stroke:var(--mut);stroke-width:2;cursor:pointer}
.tk{fill:none;stroke:var(--ok);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.pl{fill:var(--pn);stroke:var(--ac);stroke-width:1.5;cursor:pointer}.pp{stroke:var(--ac);stroke-width:2;fill:none;pointer-events:none}
.bot{display:flex;gap:6px;padding:8px 10px;border-top:1px solid var(--bd);align-items:center}
.tab{flex:1;height:40px;border-radius:10px;border:1px solid var(--bd);background:var(--pn);cursor:pointer}
.tab.on{background:var(--ac);color:var(--ink);border-color:var(--ac);font-weight:600}
.note{font-size:12px;color:var(--mut);margin-top:6px}
#md{position:fixed;inset:0;background:#0009;display:flex;align-items:flex-end;justify-content:center;z-index:9}
#md[hidden]{display:none}
.bx{background:var(--pn);width:100%;max-width:420px;border-radius:16px 16px 0 0;padding:16px;border:1px solid var(--bd);box-sizing:border-box;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.bx h3{margin:0 0 10px;font-size:15px}
.bx input{width:100%;box-sizing:border-box;height:42px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);padding:0 10px;margin-bottom:10px}
.bx button{display:block;width:100%;height:42px;margin-top:6px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);cursor:pointer}
.bx .pri{background:var(--ac);color:var(--ink);border-color:var(--ac);font-weight:600}.bx .dng{color:#ef4444}
#rp{flex:1;overflow:auto;padding:10px}#rp h3{margin:10px 0 6px;font-size:16px}#rp h4{margin:14px 0 4px;font-size:13px}
.sb{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--bd)}.sb i{display:block}
.rw{display:grid;grid-template-columns:1.4fr .8fr .8fr .8fr;gap:4px;padding:9px 4px;border-bottom:1px solid var(--bd);cursor:pointer;align-items:center}.hd{color:var(--mut);font-size:12px;cursor:default}
.it{padding:5px 2px}.gh{color:var(--mut);font-size:12px;margin-top:6px}.c1{color:#22c55e}.c2{color:#9ca3af}.c3{color:#ef4444}
.wk{display:flex;gap:6px;align-items:flex-end;height:110px;margin:8px 0}.col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;text-align:center}.col div{background:var(--ac);border-radius:4px 4px 0 0}.col small,.cl small{color:var(--mut)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:8px 0}.cal>small{text-align:center}.cl{min-height:46px;border:1px solid var(--bd);border-radius:8px;padding:3px;display:flex;flex-direction:column;cursor:pointer}
</style></head><body>
<div class="top">
 <div class="row" id="nav"><button class="ib" id="pv">‹</button><input type="date" id="dt"><button class="ib" id="nx">›</button></div>
 <div id="sub"></div>
</div>
<div id="map"><svg><g id="g"></g></svg></div>
<div id="rp" hidden></div>
<div class="bot">
 <button class="tab on" id="tD">Günlük</button><button class="tab" id="tR">Rutin</button><button class="tab" id="tP">Rapor</button>
 <button class="ib" id="zo">−</button><button class="ib" id="zf">⤢</button><button class="ib" id="zi">+</button>
</div>
<div id="md" hidden><div class="bx"><h3 id="mt"></h3><input id="mi"><div id="mb"></div></div></div>
<script>
const K='mmplan_v1',$=s=>document.querySelector(s);
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const today=()=>iso(new Date());
const addD=(s,n)=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return iso(d)};
const fmt=(s,o)=>new Date(s+'T12:00').toLocaleDateString('tr-TR',o);
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let COL={};try{COL=JSON.parse(localStorage.getItem('mmplan_col'))||{}}catch(e){}
let S=null;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S){S={nodes:[],done:{},hide:{},ren:{}};seed()}
S.rep=S.rep||{};
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function seed(){const f=today();const D=[["Sabah Rutini Yap",[["7:30 uyan"],["Yatağını Topla"],["Esneme Yap"],["Zıpla(2dk)"],["Şınav çek"],["Kişisel Bakım Rutini yap",[["Dişleri Fırçala"],["Dili Temizle"]]],["Kahvaltı yap+Emilim+1saat sonra su"]]],["Galeriyi işte düzenle"],["Yemekte faydalı video ize"],["En az 3 litre su iç"],["Yemekten 1saat sonra su iç"],["Acil yapılacaklar listesinden 1. birini yap"],["Akşam Rutini Yap",[["Gözlük takmaya başla"],["Looksmaxxing Rutini Yap",[["Göz egzersizi yap(20dk)"],["Bonsmensing yap(6dk)"]]],["Esneme yap"],["Yarın yapılacakları belirle"],["Kişisel bakım Rutini yap",[["Diş fırçala"],["Dili Temizle"],["Yüzü sabunla"]]],["Uykudan önce gül suyu kullan"],["Ağzı bantla +Burun bandı"],["00:00 önce uyu"]]]];
 (function a(l,p){l.forEach(([t,c])=>{const id=uid();S.nodes.push({id,p,tm:1,from:f,names:[[f,t]]});if(c)a(c,id)})})(D,null);save()}
let mode='day',sel=today(),eff=today(),V={x:10,y:10,k:1},mv=0,lastToday=today();
const key=(D,id)=>D+'|'+id;
const live=(n,D)=>n.from<=D&&(!n.to||D<n.to);
const act=(n,D,m)=>m==='rt'?(n.tm&&live(n,D)):n.tm?(live(n,D)&&!S.hide[key(D,n.id)]):n.day===D;
function txt(n,D,m){if(!n.tm)return n.t;if(m==='day'&&S.ren[key(D,n.id)])return S.ren[key(D,n.id)];let r=n.names[0][1];for(const[f,t]of n.names)if(f<=D)r=t;return r}
const wrap=t=>{const w=t.split(/\s+/),r=[];for(let i=0;i<w.length;i+=4)r.push(w.slice(i,i+4).join(' '));return r};
function lay(D,m,cv){const walk=(p,d)=>S.nodes.filter(n=>n.p===p&&act(n,D,m)).map(n=>{const k=walk(n.id,d+1),o={n,t:txt(n,D,m),d,k,hk:k.length>0};if(cv&&COL[n.id])o.k=[];return o});
 const root={n:null,t:'Yapılacaklar listesi',d:0,k:walk(null,1)},cw=[],all=[];let y=14;
 (function pos(o){o.ls=o.d?wrap(o.t):[o.t];o.w=o.d?58+Math.max(...o.ls.map(s=>s.length))*7.6+(o.hk?26:0):190;cw[o.d]=Math.max(cw[o.d]||0,o.w);all.push(o);
  if(!o.k.length){y+=o.d?27+19*o.ls.length:46;o.y=y}else{o.k.forEach(pos);o.y=(o.k[0].y+o.k[o.k.length-1].y)/2}})(root);
 const xs=[0];for(let i=1;i<cw.length;i++)xs[i]=xs[i-1]+cw[i-1]+46;all.forEach(o=>o.x=xs[o.d]);return all}
function stat(D){const r={t:0,g:0,y:0,r:0,u:0,it:[]};(function w(o,gp){o.k.forEach(c=>{if(c.k.length)w(c,gp||c.t);else{const s=S.done[key(D,c.n.id)]||0;r.t++;s==1?r.g++:s==2?r.y++:s==3?r.r++:r.u++;r.it.push({id:c.n.id,n:c.t,g:gp,s})}})})(lay(D,'day')[0],'');r.d=r.g;r.p=r.t?Math.round((r.g+r.y/2)/r.t*100):0;return r}
function render(){if(mode==='rp')return rpR();$('#map').hidden=false;$('#rp').hidden=true;$('#nav').style.display='';$('#tP').classList.remove('on');const m=mode,D=m==='rt'?eff:sel,all=lay(D,m,1);
 let h='';all.forEach(o=>o.k.forEach(c=>{const x1=o.x+o.w,x2=c.x,mx=(x1+x2)/2;h+=`<path class="e" d="M${x1} ${o.y}C${mx} ${o.y} ${mx} ${c.y} ${x2} ${c.y}"/>`}));
 all.forEach(o=>{const{x,y,w}=o;
  if(!o.d){h+=`<rect class="r" x="${x}" y="${y-18}" width="${w}" height="36" rx="9"/><text class="rt" x="${x+14}" y="${y+5}">${esc(o.t)}</text><g data-a="add" data-id=""><circle class="pl" cx="${x+w-20}" cy="${y}" r="11"/><path class="pp" d="M${x+w-25} ${y}h10M${x+w-20} ${y-5}v10"/></g>`;return}
  const st=m==='day'&&S.done[key(D,o.n.id)]||0,dn=st==1,ox=m==='day'?30:2,of=19*(o.ls.length-1);
  h+=`<path class="u" d="M${x} ${y}H${x+w}"/>`;
  if(m==='day')h+=`<g data-a="chk" data-id="${o.n.id}"><rect x="${x-4}" y="${y-36-of}" width="34" height="${36+of}" fill="transparent"/><rect class="cb" x="${x}" y="${y-29-of}" width="22" height="22" rx="5"/>${st==1?`<path class="tk" d="M${x+5} ${y-18-of}l5 5 8-10"/>`:st==2?`<path class="tk" style="stroke:#9ca3af" d="M${x+5} ${y-18-of}l5 5 8-10"/>`:st==3?`<path class="tk" style="stroke:#ef4444" d="M${x+6} ${y-23-of}l10 10m0-10l-10 10"/>`:''}</g>`;
  h+=`<text class="${o.d==1?'t1':'t'} ${dn?'dn':''}" data-a="menu" data-id="${o.n.id}" >${o.ls.map((s,i)=>`<tspan x="${x+ox}" y="${y-11-19*(o.ls.length-1-i)}">${esc(s)}</tspan>`).join('')}</text>`;
  if(o.hk)h+=`<g data-a="tg" data-id="${o.n.id}"><circle class="pl" cx="${x+w-42}" cy="${y-12}" r="10"/><path style="fill:var(--ac)" d="${COL[o.n.id]?`M${x+w-45} ${y-17}l7 5-7 5z`:`M${x+w-47} ${y-15}h10l-5 7z`}"/></g>`;
  h+=`<g data-a="add" data-id="${o.n.id}"><circle class="pl" cx="${x+w-14}" cy="${y-12}" r="10"/><path class="pp" d="M${x+w-19} ${y-12}h10M${x+w-14} ${y-17}v10"/></g>`});
 $('#g').innerHTML=h;
 const ap=$('#sub');
 if(m==='day'){const s=stat(sel),T=today();
  let c='<div class="chips">';for(let i=0;i<3;i++){const d=addD(T,i);c+=`<div class="chip ${d===sel?'on':''}" data-d="${d}"><b>${['Bugün','Yarın','Öbür gün'][i]}</b><small>${fmt(d,{day:'numeric',month:'short'})} · %${stat(d).p}</small></div>`}
  ap.innerHTML=c+`</div><div class="pg"><span>${fmt(sel,{weekday:'long'})}</span><div class="bar"><i style="width:${s.p}%"></i></div><span>${s.d}/${s.t} · %${s.p}</span></div>`;
  $('#dt').value=sel}
 else{ap.innerHTML=`<div class="note">Rutin düzenleme: yaptığın değişiklikler <b>${fmt(eff,{day:'numeric',month:'long',year:'numeric'})}</b> tarihinden itibaren geçerli olur. Geçmiş günler değişmez. Tarihi yukarıdan seçebilirsin.</div><div class="row" style="margin-top:8px"><button class="tab" onclick="bk()">Verileri yedekle</button><button class="tab" onclick="rs()">Geri yükle</button></div>`;$('#dt').value=eff}
 $('#tD').classList.toggle('on',m==='day');$('#tR').classList.toggle('on',m==='rt');save()}
// pan / zoom
const map=$('#map'),P=new Map();let pd=0;
const ap=()=>$('#g').setAttribute('transform',`translate(${V.x} ${V.y}) scale(${V.k})`);
const dist=()=>{const a=[...P.values()];return Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1])||1};
function zoom(f,c){const r=map.getBoundingClientRect(),k=Math.min(2.5,Math.max(.25,V.k*f)),px=c[0]-r.left,py=c[1]-r.top;V.x=px-(px-V.x)*k/V.k;V.y=py-(py-V.y)*k/V.k;V.k=k;ap()}
function fit(){const b=$('#g').getBBox(),w=map.clientWidth;const k=Math.max(.4,Math.min(1,(w-20)/(b.x+b.width||1)));V={k,x:10-b.x*k,y:10-b.y*k};ap()}
map.onpointerdown=e=>{P.set(e.pointerId,[e.clientX,e.clientY]);if(P.size==1)mv=0;if(P.size==2)pd=dist()};
window.onpointermove=e=>{const o=P.get(e.pointerId);if(!o)return;const n=[e.clientX,e.clientY];
 if(P.size==1){V.x+=n[0]-o[0];V.y+=n[1]-o[1];mv+=Math.abs(n[0]-o[0])+Math.abs(n[1]-o[1])}
 P.set(e.pointerId,n);
 if(P.size==2){const d=dist(),a=[...P.values()];zoom(d/pd,[(a[0][0]+a[1][0])/2,(a[0][1]+a[1][1])/2]);pd=d;mv=99}ap()};
window.onpointerup=window.onpointercancel=e=>P.delete(e.pointerId);
map.onwheel=e=>{e.preventDefault();zoom(e.deltaY<0?1.1:.9,[e.clientX,e.clientY])};
const mc=()=>[map.getBoundingClientRect().left+map.clientWidth/2,map.getBoundingClientRect().top+map.clientHeight/2];
$('#zi').onclick=()=>zoom(1.25,mc());$('#zo').onclick=()=>zoom(.8,mc());$('#zf').onclick=fit;
// modal
function modal(title,val,btns){$('#mt').textContent=title;const i=$('#mi');i.hidden=val===null;i.value=val||'';
 const b=$('#mb');b.innerHTML='';btns.forEach(([l,f,c])=>{const e=document.createElement('button');e.textContent=l;if(c)e.className=c;e.onclick=()=>{$('#md').hidden=true;f&&f(i.value.trim())};b.appendChild(e)});
 $('#md').hidden=false;if(val!==null)setTimeout(()=>i.focus(),50)}
$('#mi').onkeydown=e=>{if(e.key==='Enter'){const p=$('#mb .pri');p&&p.click()}};
$('#md').onclick=e=>{if(e.target.id==='md')$('#md').hidden=true};
const ask=(t,v,ok)=>modal(t,v,[['Kaydet',s=>s&&ok(s),'pri'],['İptal']]);
// actions
const get=id=>S.nodes.find(n=>n.id===id);
function addNode(p){ask(p?'Yeni alt dal':'Yeni ana görev','',t=>{if(p&&COL[p]){delete COL[p];colSave()}
 S.nodes.push(mode==='rt'?{id:uid(),p:p||null,tm:1,from:eff,names:[[eff,t]]}:{id:uid(),p:p||null,day:sel,t});render()})}
function ren(n){const D=mode==='rt'?eff:sel;ask('Yeniden adlandır',txt(n,D,mode),t=>{
 if(mode==='day'){n.tm?S.ren[key(sel,n.id)]=t:n.t=t}
 else{n.names=n.names.filter(x=>x[0]!==eff);n.names.push([eff,t]);n.names.sort((a,b)=>a[0]<b[0]?-1:1)}render()})}
const desc=id=>[id,...S.nodes.filter(n=>n.p===id).flatMap(n=>desc(n.id))];
function del(n){if(mode==='day'){if(n.tm){S.hide[key(sel,n.id)]=1}else{const ids=desc(n.id);S.nodes=S.nodes.filter(x=>!ids.includes(x.id)||x.tm)}}
 else{if(n.from>=eff){const ids=desc(n.id);S.nodes=S.nodes.filter(x=>!ids.includes(x.id))}else n.to=eff}render()}
function move(n,d){const D=mode==='rt'?eff:sel,sib=S.nodes.filter(x=>x.p===n.p&&act(x,D,mode)),i=sib.indexOf(n),o=sib[i+d];if(!o)return;
 const a=S.nodes.indexOf(n),b=S.nodes.indexOf(o);[S.nodes[a],S.nodes[b]]=[S.nodes[b],S.nodes[a]];render()}
function menu(n){const D=mode==='rt'?eff:sel,tm=n.tm&&mode==='day';
 modal(txt(n,D,mode),null,[['Alt dal ekle',()=>addNode(n.id)],['Yeniden adlandır',()=>ren(n)],['↑ Yukarı taşı',()=>move(n,-1)],['↓ Aşağı taşı',()=>move(n,1)],
 [mode==='rt'?'Rutinden kaldır ('+fmt(eff,{day:'numeric',month:'short'})+' ve sonrası)':tm?'Sadece bu gün için gizle':'Sil',()=>del(n),'dng'],['Kapat']])}
$('#g').onclick=e=>{if(mv>6)return;const t=e.target.closest('[data-a]');if(!t)return;const id=t.dataset.id,a=t.dataset.a;
 if(a==='chk')stMenu(id)
 else if(a==='add')addNode(id||null);else if(a==='menu')menu(get(id));else if(a==='tg'){COL[id]?delete COL[id]:COL[id]=1;colSave();render()}};
// nav
// rapor
let rv='d',rd=today(),det=null;
const past=a=>a.filter(d=>d<=today()),days=(a,b)=>{const r=[];for(let d=a;d<=b;d=addD(d,1))r.push(d);return r};
const rep=D=>D<today()?(S.rep[D]||stat(D)):stat(D);
const wS=D=>addD(D,-((new Date(D+'T12:00').getDay()+6)%7));
const shM=(D,n)=>{const d=new Date(D+'T12:00');d.setDate(1);d.setMonth(d.getMonth()+n);return iso(d)};
function agg(ds){const m={};past(ds).forEach(D=>rep(D).it.forEach(i=>{const o=m[i.id]||(m[i.id]={n:i.n,g:i.g,r:0,y:0});if(i.s==3)o.r++;if(i.s==2)o.y++}));return m}
function closeDays(){const t=today(),a=S.nodes.reduce((m,n)=>n.from&&n.from<m?n.from:m,t);for(let d=a;d<t;d=addD(d,1))if(!S.rep[d])S.rep[d]=stat(d);save()}
function stMenu(id){const n=get(id);modal(txt(n,sel,'day'),null,[['🟢 Tamamlandı (yeşil tik)',()=>setS(id,1)],['⚪ Yarım yapıldı (gri tik)',()=>setS(id,2)],['🔴 Yapılmadı (kırmızı çarpı)',()=>setS(id,3)],['Boş bırak',()=>setS(id,0)],['Kapat']])}
function setS(id,v){const k=key(sel,id);v?S.done[k]=v:delete S.done[k];if(sel<today())S.rep[sel]=stat(sel);render()}
const bar=s=>{const T=s.t||1;return `<div class='sb'><i style='width:${s.g/T*100}%;background:#22c55e'></i><i style='width:${s.y/T*100}%;background:#9ca3af'></i><i style='width:${s.r/T*100}%;background:#ef4444'></i></div>`};
function secs(s,st,c){const a=s.it.filter(i=>i.s==st);if(!a.length)return '';const g={};a.forEach(i=>(g[i.g||'Genel']=g[i.g||'Genel']||[]).push(i));
 return `<h4 class='c${st}'>${st==3?'Yapılmayan':'Yarım yapılan'} görevler (${a.length})</h4>`+Object.entries(g).map(([k,v])=>`<div class='gh'>${esc(k)}</div>`+v.map(i=>{const q=c&&c[i.id],n=q?(st==3?q.r+' gün yapılmadı':q.y+' gün yarım yapıldı'):'';return `<div class='it'>${esc(i.n)}${n?` <small>(bu hafta ${n})</small>`:''}</div>`}).join('')).join('')}
function dayV(D,bk){const s=rep(D),c=agg(days(wS(D),D));
 return (bk?`<button class='ib' data-back='1' style='padding:0 12px;margin-top:8px'>‹ Geri</button>`:'')+`<h3>${fmt(D,{weekday:'long',day:'numeric',month:'long',year:'numeric'})} — %${s.p}</h3>`+bar(s)+`<div class='note'><span class='c1'>Tamamlanan ${s.g}</span> · <span class='c2'>Yarım ${s.y}</span> · <span class='c3'>Yapılmayan ${s.r}</span> · İşaretlenmeyen ${s.u} · Toplam ${s.t}</div>`+secs(s,3,c)+secs(s,2,c)}
function weekV(){const ws=wS(rd),ds=days(ws,addD(ws,6)),ok=past(ds).filter(d=>rep(d).t>0);let P=0,T=0,b=null,l=null;
 ok.forEach(d=>{const s=rep(d);P+=s.g+s.y/2;T+=s.t;if(!b||s.p>rep(b).p)b=d;if(!l||s.p<rep(l).p)l=d});
 const ag=Object.values(agg(ds)).filter(o=>o.r||o.y).sort((a,b)=>b.r-a.r||b.y-a.y);
 return `<h3>Hafta toplamı: %${T?Math.round(P/T*100):0}</h3><div class='wk'>`+ds.map(d=>`<div class='col'><div style='height:${d<=today()?rep(d).p*.8:0}px'></div><small>${fmt(d,{weekday:'short'})}</small></div>`).join('')+`</div>`+(b?`<div class='note'>En verimli gün: ${fmt(b,{weekday:'long'})} (%${rep(b).p}) · En düşük: ${fmt(l,{weekday:'long'})} (%${rep(l).p})</div>`:'')+
 `<div class='rw hd'><span>Gün</span><span>Oran</span><span>Yapılmadı</span><span>Yarım</span></div>`+ds.map(d=>{const s=rep(d),f=d>today();return `<div class='rw' data-det='${d}'><span>${fmt(d,{weekday:'long'})}</span><b>${f?'–':'%'+s.p}</b><span class='c3'>${f?'':s.r}</span><span class='c2'>${f?'':s.y}</span></div>`}).join('')+
 `<h4>Görev sayaçları (bu hafta)</h4>`+(ag.length?ag.map(o=>`<div class='it'>${esc(o.n)} <small>— ${esc(o.g||'Genel')}</small>${o.r?` <span class='c3'>(${o.r} gün yapılmadı)</span>`:''}${o.y?` <span class='c2'>(${o.y} gün yarım yapıldı)</span>`:''}</div>`).join(''):`<div class='note'>Kayıt yok</div>`)}
function monV(){const f=rd.slice(0,8)+'01',fd=new Date(f+'T12:00'),off=(fd.getDay()+6)%7,n=new Date(fd.getFullYear(),fd.getMonth()+1,0).getDate(),ds=days(f,addD(f,n-1)),ok=past(ds).filter(d=>rep(d).t>0);
 let b=null,l=null;const w={};ok.forEach(d=>{const p=rep(d).p;if(!b||p>rep(b).p)b=d;if(!l||p<rep(l).p)l=d;(w[wS(d)]=w[wS(d)]||[]).push(p)});
 const av=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0,ag=Object.values(agg(ds)),
 top=k=>ag.filter(o=>o[k]).sort((a,b)=>b[k]-a[k]).slice(0,5).map(o=>`<div class='it'>${esc(o.n)} <small>— ${esc(o.g||'Genel')}</small> <span class='${k=='r'?'c3':'c2'}'>(${o[k]} gün)</span></div>`).join('')||`<div class='note'>Kayıt yok</div>`;
 return `<h3>Ortalama günlük tamamlanma: %${av(ok.map(d=>rep(d).p))}</h3>`+(b?`<div class='note'>En verimli gün: ${fmt(b,{day:'numeric',month:'long'})} (%${rep(b).p}) · En düşük: ${fmt(l,{day:'numeric',month:'long'})} (%${rep(l).p})</div>`:'')+
 `<div class='cal'>`+['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'].map(x=>`<small>${x}</small>`).join('')+'<span></span>'.repeat(off)+ds.map(d=>{const e=ok.includes(d),p=e?rep(d).p:0;return `<div class='cl' ${d<=today()?`data-det='${d}'`:''} style='${e?`background:color-mix(in srgb,var(--ok) ${p*.8}%,transparent)`:''}'><small>${+d.slice(8)}</small><b>${e?'%'+p:''}</b></div>`}).join('')+`</div>`+
 `<h4>Haftalara göre ortalama</h4>`+Object.entries(w).map(([k,a])=>`<div class='it'>${fmt(k,{day:'numeric',month:'short'})} haftası: %${av(a)}</div>`).join('')+`<h4>En sık yapılmayan görevler</h4>`+top('r')+`<h4>En sık yarım yapılan görevler</h4>`+top('y')}
function rpR(){$('#map').hidden=true;const el=$('#rp');el.hidden=false;$('#nav').style.display='none';$('#sub').innerHTML='';$('#tD').classList.remove('on');$('#tR').classList.remove('on');$('#tP').classList.add('on');
 let h=`<div class='chips'>`+[['d','Günlük'],['w','Haftalık'],['m','Aylık']].map(([k,l])=>`<div class='chip ${rv===k?'on':''}' data-rv='${k}'><b>${l}</b></div>`).join('')+`</div>`;
 if(det)h+=dayV(det,1);else{const ws=wS(rd),lb=rv=='d'?fmt(rd,{day:'numeric',month:'long',year:'numeric'}):rv=='w'?fmt(ws,{day:'numeric',month:'short'})+' – '+fmt(addD(ws,6),{day:'numeric',month:'short'}):fmt(rd,{month:'long',year:'numeric'});
 h+=`<div class='row' style='margin:8px 0'><button class='ib' data-sh='-1'>‹</button><div style='flex:1;text-align:center;font-weight:600'>${lb}</div><button class='ib' data-sh='1'>›</button></div>`+(rv=='d'?dayV(rd):rv=='w'?weekV():monV())}
 el.innerHTML=h;save()}
